<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SSPCM Secure Payment Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: #0d111d;
      --border-color: rgba(255, 255, 255, 0.05);
      --input-bg: #090c15;
      --text-primary: #ffffff;
      --text-secondary: #64748b;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    .payment-card {
      width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-tag {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      text-align: center;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      text-align: center;
    }

    .qr-container {
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .qr-image {
      height: 140px;
      width: 140px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .agent-mob-display {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    #payUtr {
      font-family: monospace;
      letter-spacing: 1px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
      margin-top: 6px;
      text-align: center;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0.5px);
    }
  </style>
</head>
<body>
  <div class="payment-card">
    <!-- Header -->
    <div class="header-tag">Secure Payment Gateway</div>

    <!-- Title & Subtitle -->
    <h3 class="title">Pay to Continue</h3>
    <p class="subtitle">Click the button below to pay and start automation</p>

    <!-- QR Code Card Container -->
    <div class="qr-container">
      <a href="https://rzp.io/rzp/VNb6ZlQ" target="_blank" style="display: block;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Frzp.io%2Frzp%2FVNb6ZlQ" class="qr-image" alt="Payment QR">
      </a>
    </div>

    <!-- Payment Inputs -->
    <div class="form-group">
      <label for="studentIdDisp">SSP Student ID</label>
      <input type="text" id="studentIdDisp" value="" disabled style="opacity: 0.9; cursor: not-allowed; background: rgba(56, 189, 248, 0.08); color: #38bdf8; border-color: rgba(56, 189, 248, 0.25); font-weight: bold; letter-spacing: 0.5px;">
    </div>

    <div class="form-group">
      <label for="agentId">Agent ID</label>
      <input type="text" id="agentId" value="" disabled style="opacity: 0.7; cursor: not-allowed; background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>
    <div class="form-group">
      <label for="agentName">Agent Name</label>
      <input type="text" id="agentName" value="" disabled style="opacity: 0.7; cursor: not-allowed; background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>

    <div class="form-group">
      <label for="agentMobNo">Agent Mob No</label>
      <input type="text" id="agentMobNo" value="" disabled style="opacity: 0.7; cursor: not-allowed; background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>



    <!-- Submit Payment button -->
    <button id="btnSubmitPayment" class="btn-submit">Pay ₹10 & Start Automation</button>
  </div>

  <script src="payment.js"></script>
</body>
</html>
