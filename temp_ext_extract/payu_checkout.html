<!DOCTYPE html>
<html>
<head>
    <title>PayU Checkout - Redirecting...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #241c36, #12121a); color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .loader { border: 4px solid rgba(144, 112, 255, 0.2); border-top: 4px solid #b070ff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 24px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { text-align: center; background: rgba(30, 30, 40, 0.8); padding: 40px; border-radius: 16px; border: 1px solid rgba(144, 112, 255, 0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #b070ff; font-weight: 800; }
        p { color: #8c8c9e; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2>Secure Payment</h2>
        <p>Connecting to PayU... Please wait.</p>
    </div>
    <form id="payuForm" method="POST" action="https://secure.payu.in/_payment" style="display: none;">
    </form>
    <script src="payu_checkout.js"></script>
</body>
</html>
