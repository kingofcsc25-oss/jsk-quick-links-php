<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SSPCM Secure Payment Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: #0d111d;
      --border-color: rgba(255, 255, 255, 0.05);
      --input-bg: #090c15;
      --text-primary: #ffffff;
      --text-secondary: #64748b;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    .payment-card {
      width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-tag {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      text-align: center;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      text-align: center;
    }

    .qr-container {
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .qr-image {
      height: 140px;
      width: 140px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .agent-mob-display {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    #payUtr {
      font-family: monospace;
      letter-spacing: 1px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
      margin-top: 6px;
      text-align: center;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0.5px);
    }

    .back-link {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 15px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="payment-card">
    <!-- Back Link -->
    <a href="popup.html" class="back-link">← Back to Dashboard</a>

    <!-- Header -->
    <div class="header-tag">Secure Payment Gateway</div>

    <!-- Title & Subtitle -->
    <h3 class="title">Recharge Wallet</h3>
    <p class="subtitle" style="margin-bottom: 15px;">Use PayU or Scan QR to recharge your wallet</p>

    <!-- Special Offer Banner -->
    <div style="background: linear-gradient(90deg, rgba(236, 72, 153, 0.15), rgba(168, 85, 247, 0.15)); border: 1px dashed rgba(168, 85, 247, 0.4); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; text-align: center; width: 100%; box-sizing: border-box;">
      <span style="font-size: 10px; font-weight: 800; color: #f472b6; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-bottom: 4px;">🎉 Special Offer 🎉</span>
      <span style="font-size: 12px; font-weight: 700; color: #fff; line-height: 1.4;">Pay <strong style="color: #38bdf8;">₹200 or above</strong> to get <strong style="color: #10b981;">2X POINTS</strong>!</span>
    </div>

    <!-- Recharge Amount and Points Preview -->
    <div class="form-group" style="margin-bottom: 12px;">
      <label for="rechargeAmount">Recharge Amount (₹)</label>
      <input type="number" id="rechargeAmount" value="100" min="10" placeholder="Enter Amount" style="text-align: center; font-size: 16px; font-weight: bold; border-color: rgba(56, 189, 248, 0.4);">
      <p id="pointsCalcText" style="font-size: 13px; font-weight: 700; color: #10b981; text-align: center; margin-top: 6px; text-shadow: 0 0 5px rgba(16, 185, 129, 0.3);">
        Points to get: 100 PTS
      </p>
    </div>

    <!-- Dynamic UPI QR Code (for Manual Payment) -->
    <div style="display: none; background: white; padding: 10px; border-radius: 8px; margin-bottom: 12px; width: 125px; height: 125px; align-items: center; justify-content: center; margin-left: auto; margin-right: auto; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);">
      <img id="dynamicQRCode" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=janaesevakendra@upi%26pn=Jana%20Seva%20Kendra%26am=100%26cu=INR" alt="UPI QR" style="max-width: 100%; max-height: 100%; object-fit: contain;">
    </div>
    
    <div style="display: none; font-size: 10px; color: white; font-weight: bold; margin-bottom: 12px; background: rgba(56, 189, 248, 0.08); border: 1px dashed rgba(56, 189, 248, 0.3); padding: 6px; border-radius: 6px; text-align: center; width: 100%;">
      UPI ID: <span style="color: #38bdf8; user-select: all;">janaesevakendra@upi</span>
    </div>

    <!-- Payment Inputs -->
    <div class="form-group">
      <label for="studentIdDisp">Agent ID</label>
      <input type="text" id="studentIdDisp" value="" style="background: rgba(56, 189, 248, 0.08); color: #38bdf8; border-color: rgba(56, 189, 248, 0.25); font-weight: bold; letter-spacing: 0.5px;">
    </div>

    <div class="form-group" style="display: none;">
      <label for="agentId">Agent ID</label>
      <input type="text" id="agentId" value="" disabled style="opacity: 0.7; cursor: not-allowed; background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>
    <div class="form-group">
      <label for="agentName">Agent Name</label>
      <input type="text" id="agentName" value="" style="background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>

    <div class="form-group">
      <label for="agentMobNo">Agent Mob No</label>
      <input type="text" id="agentMobNo" value="" style="background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>

    <div class="form-group">
      <label for="agentEmail">Agent Email ID</label>
      <input type="text" id="agentEmail" value="" style="background: rgba(255,255,255,0.03); color: #94a3b8; border-color: rgba(255,255,255,0.03);">
    </div>

    <!-- Submit Payment buttons -->
    <div style="display: flex; gap: 8px; width: 100%; margin-top: 4px;">
      <button id="btnSubmitPayment" class="btn-submit" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); flex: 1; padding: 12px 5px; font-size: 11px; margin-top: 0;">Pay Instantly (PayU)</button>
    </div>
  </div>

  <script src="payment.js"></script>
</body>
</html>
